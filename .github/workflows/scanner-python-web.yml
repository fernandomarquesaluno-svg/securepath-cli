name: Scanner Python no navegador
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scanner-python-web.yml'
      - 'artefatos.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-python-web
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar runtime local e interface
        run: |
          set -euo pipefail
          mkdir -p docs/scan-python/runtime
          cp artefatos.py docs/scan-python/artefatos.py
          curl -fsSL --retry 2 --max-time 120 https://github.com/pyodide/pyodide/releases/download/0.27.7/pyodide-core-0.27.7.tar.bz2 -o "$RUNNER_TEMP/pyodide.tar.bz2"
          tar -xjf "$RUNNER_TEMP/pyodide.tar.bz2" -C "$RUNNER_TEMP"
          for file in pyodide.js pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            src=$(find "$RUNNER_TEMP" -name "$file" -type f | head -n 1)
            test -n "$src"
            cp "$src" "docs/scan-python/runtime/$file"
          done
          curl -fsSL --max-time 40 https://raw.githubusercontent.com/pyodide/pyodide/0.27.7/LICENSE -o docs/scan-python/runtime/LICENSE
          (cd docs/scan-python/runtime && sha256sum pyodide* python_stdlib.zip > SHA256SUMS)
          cat > docs/scan-python/worker.js <<'EOF'
          let py;
          const root=new URL('./',self.location.href);
          const emit=(type,extra={})=>postMessage({type,...extra});
          self.onmessage=async ({data})=>{
            try{
              if(data.type==='init'){
                importScripts(new URL('runtime/pyodide.js',root).href);
                py=await loadPyodide({indexURL:new URL('runtime/',root).href});
                const response=await fetch(new URL('artefatos.py',root));
                if(!response.ok)throw new Error('Núcleo Python indisponível');
                py.FS.writeFile('/home/pyodide/artefatos.py',await response.text());
                py.runPython('import sys, json\nfrom pathlib import Path\nsys.path.insert(0, "/home/pyodide")\nfrom artefatos import Summary, RULES, IGNORED_DIRS, scan_file, load_rules_file');
                emit('ready');return;
              }
              if(!py||data.type!=='scan')return;
              const {files,custom,exclusions}=data;
              py.FS.writeFile('/tmp/rules.json',custom||'{"rules":[]}');
              py.runPython('active_rules=load_rules_file(Path("/tmp/rules.json"))');
              py.FS.unlink('/tmp/rules.json');
              const ignored=new Set(JSON.parse(py.runPython('json.dumps(sorted(IGNORED_DIRS))')));
              for(const d of exclusions)ignored.add(d);
              const result={scanner:'SecurePath CLI (Python / Pyodide)',schema_version:'1.0',summary:{examined:0,skipped:0,io_errors:0,findings:0},findings:[]};
              for(let i=0;i<files.length;i++){
                const f=files[i],path=f.webkitRelativePath||f.name;
                if(path.split('/').slice(0,-1).some(d=>ignored.has(d))||f.size>5*1024*1024){result.summary.skipped++;}
                else{
                  py.FS.writeFile('/tmp/input',new Uint8Array(await f.arrayBuffer()));
                  try{
                    const item=JSON.parse(py.runPython('summary=Summary(output_format="json")\nscan_file(Path("/tmp/input"),summary,5*1024*1024,rules=active_rules,emit=False)\njson.dumps({"examined":summary.examined,"skipped":summary.skipped,"io_errors":summary.errors,"findings":[f.to_dict() for f in summary.records]})'));
                    for(const k of ['examined','skipped','io_errors'])result.summary[k]+=item[k];
                    for(const hit of item.findings)result.findings.push({...hit,path});
                  }finally{py.FS.unlink('/tmp/input');}
                }
                emit('progress',{done:i+1,total:files.length});
              }
              result.summary.findings=result.findings.length;
              emit('result',{result});
            }catch(e){emit('error',{message:data.type==='init'?'Não foi possível iniciar Python no navegador.': 'Falha na análise ou configuração inválida. Confira as regras e tente novamente.'});}
          };
          EOF
          cat > docs/scan-python/ui.js <<'EOF'
          const $=id=>document.getElementById(id);
          let worker=null, timer=null, ready=false, running=false, result=null,dropped=[];
          const status=t=>{$('status').textContent=t};
          const stopTimer=()=>{clearTimeout(timer);timer=null};
          function resetWorker(){stopTimer();if(worker)worker.terminate();worker=null;ready=false;running=false;$('run').disabled=false;$('cancel').disabled=true}
          function clearReport(){result=null;$('summary').textContent='Nenhuma análise realizada.';$('rows').replaceChildren();for(const id of ['json','csv','txt'])$(id).disabled=true}
          function timeout(ms){stopTimer();timer=setTimeout(()=>{resetWorker();status('Limite de tempo atingido; execução cancelada e memória descartada.')},ms)}
          function render(){
            if(!result)return;
            $('summary').textContent='Analisados: '+result.summary.examined+' · Ignorados: '+result.summary.skipped+' · Erros: '+result.summary.io_errors+' · Alertas: '+result.summary.findings;
            const q=$('filter').value.toLowerCase();$('rows').replaceChildren();
            for(const x of result.findings.filter(x=>(x.path+' '+x.category+' '+x.rule_id).toLowerCase().includes(q))){
              const tr=document.createElement('tr');
              for(const v of [x.path,x.line,x.rule_id,x.category]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr);
            }
            for(const id of ['json','csv','txt'])$(id).disabled=false;
          }
          function start(){
            if(running)return;
            const files=[...$('files').files,...$('folder').files,...dropped],text=$('text').value;
            if(text)files.push(new File([text],'texto-sintetico.txt',{type:'text/plain'}));
            if(!files.length){status('Selecione arquivos ou digite texto sintético.');return}
            if(files.length>500||files.reduce((s,f)=>s+f.size,0)>25*1024*1024){status('Limite: 500 arquivos e 25 MiB no total.');return}
            const custom=$('rules').value.trim(),exclusions=$('exclude').value.split(',').map(x=>x.trim()).filter(Boolean);
            if(new TextEncoder().encode(custom).length>65536){status('Limite de 64 KiB para regras.');return}
            resetWorker();clearReport();running=true;$('run').disabled=true;$('cancel').disabled=false;$('progress').max=files.length;$('progress').value=0;
            status('Carregando Python e o núcleo do scanner...');
            const w=new Worker('worker.js');worker=w;
            timeout(90000);
            w.onmessage=({data:m})=>{
              if(w!==worker)return;
              if(m.type==='ready'){status('Analisando localmente...');timeout(30000);w.postMessage({type:'scan',files,custom,exclusions})}
              if(m.type==='progress'){$('progress').value=m.done;status(m.done+' / '+m.total+' arquivos processados');timeout(30000)}
              if(m.type==='result'){result=m.result;resetWorker();render();status('Análise concluída; memória de trabalho descartada.')}
              if(m.type==='error'){resetWorker();status(m.message)}
            };
            w.onerror=()=>{resetWorker();status('Falha no runtime Python. Recarregue a página.')};
            w.postMessage({type:'init'});
          }
          $('run').onclick=start;$('cancel').onclick=()=>{resetWorker();status('Cancelado. Memória de trabalho descartada.')};
          $('example').onclick=()=>{$('text').value='password = "somente-ficticio"\nstatus = "ok"';status('Exemplo sintético carregado.')};
          $('clear').onclick=()=>{resetWorker();for(const id of ['files','folder','text','rules','exclude','filter'])$(id).value='';dropped=[];clearReport();$('progress').value=0;status('Entrada limpa.')};
          $('filter').oninput=render;
          const zone=$('drop');zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();dropped=[...e.dataTransfer.files];status(dropped.length+' arquivo(s) adicionados por arrastar e soltar.')};
          function download(type){
           if(!result)return;
           const safe=x=>{let t=String(x);if(/^[\s]*[=+\-@]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};
           let data=type==='json'?JSON.stringify(result,null,2):type==='csv'?[['arquivo','linha','regra','categoria'],...result.findings.map(x=>[x.path,x.line,x.rule_id,x.category])].map(r=>r.map(safe).join(',')).join('\n'):result.findings.map(x=>x.path+':'+x.line+' | '+x.rule_id+' | '+x.category).join('\n')+'\n'+JSON.stringify(result.summary);
           const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download='securepath.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
          }
          for(const id of ['json','csv','txt'])$(id).onclick=()=>download(id);
          window.addEventListener('pagehide',resetWorker);
          EOF
          cat > docs/scan-python/index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>SecurePath · Scanner Python</title><style>body{font:16px system-ui;background:#0b121a;color:#e6edf4;max-width:1050px;margin:auto;padding:24px}a{color:#b8ff66}h1{font-size:clamp(28px,5vw,54px);line-height:1.1}p{line-height:1.65}section{background:#101d28;border:1px solid #344653;padding:20px;border-radius:14px;margin:20px 0}label{display:block;margin:12px 0}input,textarea{display:block;box-sizing:border-box;width:100%;max-width:100%;padding:10px;color:inherit;background:#080d15;border:1px solid #405766;border-radius:7px;margin:8px 0;font:inherit}textarea{min-height:100px}button{border:0;background:#b8ff66;color:#102010;padding:10px 16px;border-radius:8px;font:600 15px system-ui;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}progress{width:100%;accent-color:#b8ff66}#drop{padding:22px;border:2px dashed #405766;border-radius:9px;text-align:center}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #344653;overflow-wrap:anywhere}summary{cursor:pointer;color:#b8ff66}</style><script src="ui.js" defer></script></head><body><a href="../#scanner">← SecurePath</a><h1>Scanner Python no navegador</h1><p>O núcleo original <code>artefatos.py</code> é executado em um Web Worker usando Pyodide 0.27.7. A cópia do Python e o runtime são servidos pelo próprio site. Não enviamos o conteúdo dos arquivos a terceiros. Use somente arquivos autorizados e exemplos fictícios.</p><section><h2>Entrada</h2><label>Arquivos locais<input id="files" type="file" multiple></label><label>Diretório (quando suportado)<input id="folder" type="file" webkitdirectory multiple></label><div id="drop">Arraste arquivos aqui</div><label>Texto sintético<textarea id="text"></textarea></label><details><summary>Configurações avançadas</summary><label>Regras JSON adicionais<textarea id="rules" placeholder='{"rules":[]}'></textarea></label><label>Diretórios excluídos, separados por vírgula<input id="exclude"></label><p>Use somente expressões regulares confiáveis. O cancelamento encerra o worker; uma análise sem progresso por 30 segundos também é interrompida.</p></details><button id="example">Exemplo</button><button id="run">Analisar</button><button id="cancel" disabled>Cancelar</button><button id="clear">Limpar</button><progress id="progress" max="1" value="0"></progress><p id="status" role="status">Pronto. Limites: 500 arquivos, 25 MiB no total, 5 MiB por arquivo.</p></section><section><h2>Resultados</h2><p id="summary">Nenhuma análise realizada.</p><label>Filtrar por arquivo ou categoria<input id="filter"></label><div class="scroll"><table><thead><tr><th>Arquivo</th><th>Linha</th><th>Regra</th><th>Categoria</th></tr></thead><tbody id="rows"></tbody></table></div><button id="json" disabled>JSON</button><button id="csv" disabled>CSV</button><button id="txt" disabled>Texto</button></section><section><h2>Limitações</h2><p>Execução sequencial: o navegador não reproduz o paralelismo da CLI. A seleção de diretórios depende do navegador. Arquivos binários e grandes são ignorados pelo núcleo Python; a exclusão de diretórios usa caminhos relativos disponibilizados pelo seletor. Alertas indicam padrões, não a validade de credenciais. O runtime exige download inicial e memória do navegador.</p><p><a href="https://github.com/fernandomarquesaluno-svg/securepath-cli/blob/main/artefatos.py">Código-fonte</a> · <a href="https://pyodide.org/en/0.27.7/">Pyodide 0.27.7</a></p></section></body></html>
          EOF
          mkdir -p experiments
          cat > experiments/test_browser.py <<'EOF'
          import functools,http.server,threading,subprocess,sys,json,tempfile
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          srv=http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(http.server.SimpleHTTPRequestHandler,directory=root/'docs'))
          threading.Thread(target=srv.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{srv.server_port}'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              pg=b.new_page(viewport={'width':390,'height':844})
              external=[]
              pg.route('**/*',lambda route: route.continue_() if route.request.url.startswith(base) else (external.append(route.request.url),route.abort()))
              pg.goto(base+'/scan-python/')
              text='password = "somente-ficticio"\nstatus = "ok"\n'
              pg.locator('#text').fill(text)
              pg.locator('#run').click()
              pg.wait_for_function("document.getElementById('status').textContent.startsWith('Análise concluída')",timeout=90000)
              assert pg.locator('#rows tr').count()==1
              assert 'SEC004' in pg.locator('#rows').inner_text()
              assert 'somente-ficticio' not in pg.locator('#rows').inner_text()
              with tempfile.TemporaryDirectory() as t:
                  f=Path(t)/'texto-sintetico.txt';f.write_text(text)
                  cli=json.loads(subprocess.check_output([sys.executable,str(root/'artefatos.py'),str(f),'--format','json']))
                  assert cli['summary']['findings']==pg.locator('#rows tr').count()
                  assert cli['findings'][0]['rule_id'] in pg.locator('#rows').inner_text()
              pg.locator('#filter').fill('inexistente')
              assert pg.locator('#rows tr').count()==0
              pg.locator('#clear').click()
              pg.locator('#files').set_input_files([{'name':'a.txt','mimeType':'text/plain','buffer':b'password = "example"\\n'},{'name':'b.bin','mimeType':'application/octet-stream','buffer':b'abc\x00password = "example"'}])
              pg.locator('#run').click()
              pg.wait_for_function("document.getElementById('status').textContent.startsWith('Análise concluída')",timeout=90000)
              assert 'Ignorados: 1' in pg.locator('#summary').inner_text()
              assert pg.locator('#rows tr').count()==1
              pg.locator('#clear').click()
              pg.locator('#text').fill('status="ok"')
              pg.locator('#run').click();pg.locator('#cancel').click()
              assert 'Cancelado' in pg.locator('#status').inner_text()
              assert not external,external
              assert pg.evaluate('document.documentElement.scrollWidth <= innerWidth')
              b.close()
          srv.shutdown()
          print('Browser: equivalência com CLI, arquivo binário, filtro, cancelamento, responsividade e nenhum pedido externo observados.')
          EOF
      - name: Validar no Chromium
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
          python experiments/test_browser.py | tee docs/scan-python/validacao.txt
      - name: Integrar ao site após validação
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          marker='<div class="scanner-live">'
          if 'href="./scan-python/"' not in s:
              assert marker in s
              s=s.replace(marker,marker+'<div class="scanner-panel"><h2>Scanner Python real</h2><p>Execute o núcleo original em WebAssembly no próprio navegador, com arquivos, diretórios, filtros, regras JSON e exportação. Validado em Chromium.</p><a href="./scan-python/">Abrir scanner Python →</a></div>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scan-python docs/index.html experiments/test_browser.py
          git commit -m 'feat: publicar scanner Python real validado no navegador'
          git pull --rebase origin main
          git push origin HEAD:main
