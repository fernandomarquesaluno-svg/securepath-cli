name: Armazenar narração aprovada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cache-narration.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e verificar a faixa autorizada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/media
          curl --fail --location --retry 2 --max-time 90 'https://resource2.heygen.ai/text_to_speech/7174ce40798a4bcbbc0b17ae688dad49/9ce5f601f9e04382bb26141d5a3f839d/id=d2f9c659a4e84182b7e5a42508e51b6b.wav' -o docs/media/securepath-narracao-natural.wav
          echo 'bdee9f3803b9865c532f80d5b53372db29ae2432eefc2a420c3c083f62795b55  docs/media/securepath-narracao-natural.wav' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/securepath-narracao-natural.wav
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'media: armazenar narração neural aprovada e verificada'
          git push origin HEAD:main
